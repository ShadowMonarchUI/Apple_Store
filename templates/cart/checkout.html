{% extends 'base.html' %}

{% block title %}Apple Store - Checkout{% endblock %}

{% block content %}
<div class="container py-5" style="margin-top: 10vh;">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <h1 class="display-5 fw-bold text-white mb-4">Checkout.</h1>
            
            <div class="bento-box p-4 p-md-5 mb-4">
                <h3 class="text-white mb-4">Shipping Information</h3>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label text-white-50">Full Name</label>
                        <input type="text" name="customer_name" class="form-control glass-input" required value="{{ request.user.username|default:'' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-white-50">Email Address</label>
                        <input type="email" name="customer_email" class="form-control glass-input" required value="{{ request.user.email|default:'' }}">
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-white-50">Shipping Address</label>
                        <textarea name="shipping_address" class="form-control glass-input" rows="3" required></textarea>
                    </div>
                    
                    <div class="border-top border-dark pt-4 mb-4 text-white">
                        <div class="d-flex justify-content-between mb-2">
                            <span>Subtotal</span>
                            <span>${{ total }}</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2 text-white-50 small">
                            <span>Shipping</span>
                            <span>Free</span>
                        </div>
                        <div class="d-flex justify-content-between mt-3">
                            <span class="fs-5 fw-bold">Total</span>
                            <span class="fs-4 fw-bold">${{ total }}</span>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-buy glow-btn w-100 py-3 fs-5">Place Order</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
